[project]
name = "assignment"
version = "0.1.0"
description = ""
authors = [{ name = "Saxion" }]
requires-python = ">=3.14,<4.0"
dependencies = [
    # VAN DEZE REGELS: bewust teruggedraaid voor vulnerability-testing.
    # Flask 3.0.3 + Werkzeug 3.0.3: GHSA-cedw (CVE-2024-49766) en CVE-2024-49767, beide high.
    # Jinja2 3.1.4: CVE-2024-56201, CVE-2024-56326 en CVE-2025-27516, alle high.
    # Gunicorn 21.2.0: CVE-2024-1135 (HTTP request smuggling), high.
    # Voor de gelekte-versie van de opdracht: draai ze terug naar de originele versies
    # (flask >=3.1.3, gunicorn >=26.2.0 en de twee extra regels weg).
    "flask (>=3.0.3,<3.1.0)",
    "werkzeug (>=3.1.6,<3.1.7)",
    "jinja2 (>=3.1.4,<3.1.5)",
    "gunicorn (>=21.2.0,<22.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
