apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-security
  labels:
    app: quoterxp
spec:
  replicas: 1
  # Rolling update: de nieuwe pod moet eerst gezond zijn (readiness probe) voordat de oude weggaat.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: quoterxp
  template:
    metadata:
      labels:
        app: quoterxp
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: quoterxp
        # :latest is een plaatsvervanger. De pipeline vervangt dit bij het deployen door de tag van de commit.
        image: stensel8/devops-security:latest
        imagePullPolicy: Always
        ports:
          - containerPort: 5000
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        # Readiness: pas verkeer naar de pod en pas "uitgerold" als de app echt antwoordt.
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 3
          periodSeconds: 5
        # Liveness: herstart de container als de app later vastloopt.
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
          - name: data
            mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
      imagePullSecrets:
        - name: regcred
