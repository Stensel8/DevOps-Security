name: CI/CD

# Pushes naar main en handmatige runs op main draaien de volledige pipeline inclusief deploy.
# Pull requests en handmatige runs op een andere branch valideren en bouwen alleen -
# geen image-push, geen deploy.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Least privilege: geen enkele job schrijft naar de repo via GITHUB_TOKEN.
# Docker Hub authenticeert met eigen secrets.
permissions:
  contents: read

jobs:

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Check pyproject.toml and poetry.lock are in sync
        working-directory: app
        run: poetry check --lock

      - name: Byte-compile the application
        run: python -m compileall app

  build:
    name: Build
    needs: [ validate ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          # Docker login uit GitHub secrets. NOOIT hardcoded!
          # Secrets worden veilig geïnjecteerd en niet in logs getoond.
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Het Dockerfile heeft twee stages: een builder (tussenimage met Poetry en pip) en de runtime.
      # Met target: runtime bouwen we het applicatie-image en alleen dat wordt gepusht. De builder is een
      # tussenstap die niet op Docker Hub komt.
      # Het image krijgt twee tags: latest, en de commit-SHA. Die tag is voor deze commit altijd hetzelfde
      # image. Daarmee testen en deployen we precies dit image, en kunnen we terug naar een vorige versie.
      # Op een pull request wordt het image wel gebouwd maar niet gepusht,
      # zodat een kapotte Dockerfile alsnog opvalt voor de merge.
      - name: Build and push the application image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            stensel8/devops-security:latest
            stensel8/devops-security:${{ github.sha }}

  test:
    name: Test
    needs: [ build ]
    # Draait tegen het zojuist gepushte image, dus alleen op main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          # Docker login uit GitHub secrets. NOOIT hardcoded!
          # Secrets worden veilig geïnjecteerd en niet in logs getoond.
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      # Test het image van deze commit (de SHA-tag), dus niet latest: dat kan intussen een andere zijn.
      - name: Smoke test the container
        env:
          IMAGE: stensel8/devops-security:${{ github.sha }}
        run: |
          set -euo pipefail
          docker pull --quiet "$IMAGE" >/dev/null
          container=$(docker run -d -p 80:5000 "$IMAGE")
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          # De eerste verzoeken mislukken als de container nog opstart. Daarom wachten we stil tot de
          # app antwoordt, maximaal 30 seconden. Met --fail telt ook een HTTP 4xx of 5xx als mislukt.
          for _ in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://localhost; then
              echo "Container antwoordde met HTTP 2xx."
              exit 0
            fi
            sleep 1
          done
          echo "Container antwoordde niet binnen 30 seconden. Log van de container:" >&2
          docker logs "$container" >&2
          exit 1

  # Scant het gepushte image met Docker Scout en faalt bij een Critical of High. Deploy wacht hierop, dus
  # zo'n image komt niet op het cluster. Draait alleen op main, want alleen daar wordt het image gepusht.
  # write-comment staat uit: opmerkingen plaatsen werkt alleen op pull requests. Het resultaat staat in de
  # samenvatting van de job.
  scan:
    name: Scan
    needs: [ build ]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          # Docker login uit GitHub secrets. NOOIT hardcoded!
          # Secrets worden veilig geïnjecteerd en niet in logs getoond.
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      # Scant het image van deze commit (de SHA-tag), dus niet latest.
      - name: Analyze the image for vulnerabilities
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: cves
          image: stensel8/devops-security:${{ github.sha }}
          only-severities: critical,high
          exit-code: true
          write-comment: false

  deploy:
    name: Deploy
    needs: [ test, scan ]
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 10
    # Twee deploys tegelijk zou elkaar in de weg zitten: ze wachten op elkaar.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pull-secret voor het cluster, gemaakt uit GitHub-secrets: het token staat dus niet
      # in een bestand of in de shell-history op CN1. Het is een apart alleen-lezen token.
      - name: Create image pull secret
        env:
          DOCKERHUB_LOGIN: ${{ secrets.DOCKERHUB_LOGIN }}
          DOCKER_HUB_PULL_PAT: ${{ secrets.DOCKER_HUB_PULL_PAT }}
        run: |
          : "${DOCKER_HUB_PULL_PAT:?secret DOCKER_HUB_PULL_PAT ontbreekt}"
          kubectl create secret docker-registry regcred \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="$DOCKERHUB_LOGIN" \
            --docker-password="$DOCKER_HUB_PULL_PAT" \
            --dry-run=client -o yaml | kubectl apply -f -

      # In deployment.yaml staat :latest als plaatsvervanger. Hier vervangen we die door de tag van deze
      # commit. Elke deploy heeft dan een ander image en Kubernetes doet een echte rollout, waarbij de
      # oude pod blijft draaien tot de nieuwe gezond is. Daarna wachten we tot de uitrol echt klaar is en de
      # app antwoordt. Lukt dat niet, dan draaien we terug naar de vorige versie en faalt de job.
      - name: Deploy the new version
        env:
          IMAGE: stensel8/devops-security:${{ github.sha }}
        run: |
          set -euo pipefail

          rollback() {
            echo "Uitrol mislukt. Status van de pods:" >&2
            kubectl get pods -l app=quoterxp -o wide >&2 || true
            kubectl logs -l app=quoterxp --tail=20 --prefix >&2 || true
            echo "Terugdraaien naar de vorige versie." >&2
            kubectl rollout undo deployment/devops-security >&2 || true
            exit 1
          }

          sed "s|stensel8/devops-security:latest|${IMAGE}|" kubernetes/deployment.yaml | kubectl apply -f -
          kubectl apply -f kubernetes/service.yaml

          kubectl rollout status deployment/devops-security --timeout=120s || rollback

          for _ in $(seq 1 15); do
            if curl --fail --silent --output /dev/null http://localhost:30000; then
              echo "De nieuwe versie draait en antwoordt via de Service."
              exit 0
            fi
            sleep 2
          done
          rollback
