name: CI/CD

# Pushes naar main en handmatige runs op main draaien de volledige pipeline inclusief deploy.
# Pull requests en handmatige runs op een andere branch valideren en bouwen alleen -
# geen image-push, geen deploy.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Least privilege: geen enkele job schrijft naar de repo via GITHUB_TOKEN.
# Docker Hub authenticeert met eigen secrets.
permissions:
  contents: read

jobs:

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # uv zelf als los, gepind binary (release tarball + checksum), niet via een Action van een derde partij.
      - name: Install uv
        run: |
          set -euo pipefail
          curl -sL -o uv.tar.gz https://github.com/astral-sh/uv/releases/download/0.13.5/uv-x86_64-unknown-linux-gnu.tar.gz
          echo "f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f  uv.tar.gz" | sha256sum -c
          tar xzf uv.tar.gz
          sudo install -m 0755 uv-x86_64-unknown-linux-gnu/uv /usr/local/bin/uv

      # --locked faalt hard als uv.lock niet meer bij pyproject.toml past (zelfde als poetry check --lock deed).
      - name: Install the dependencies
        working-directory: app
        run: uv sync --locked --no-install-project

      # De tests in tests/ controleren onder andere dat het access log niet te vervalsen is.
      - name: Run the unit tests
        working-directory: app
        run: uv run python -m unittest discover -s ../tests -v

      - name: Byte-compile the application
        run: python -m compileall app

  build:
    name: Build
    needs: [ validate ]
    runs-on: ubuntu-latest
    # Alleen deze job mag naar GitHub Container Registry pushen (packages: write), en alleen daarvoor.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          # Docker login uit GitHub secrets. NOOIT hardcoded!
          # Secrets worden veilig geïnjecteerd en niet in logs getoond.
          username: ${{ secrets.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      # GHCR: tweede plek voor hetzelfde image. GITHUB_TOKEN is genoeg (geen los secret nodig),
      # met alleen packages: write hierboven, niet voor de rest van de pipeline.
      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Het Dockerfile heeft twee stages: een builder (tussenimage met uv) en de runtime.
      # Met target: runtime bouwen we het applicatie-image en alleen dat wordt gepusht. De builder is een
      # tussenstap die niet op Docker Hub komt.
      # Het image krijgt twee tags per registry: latest, en de commit-SHA. Die tag is voor deze commit
      # altijd hetzelfde image. Daarmee testen en deployen we precies dit image, en kunnen we terug naar
      # een vorige versie. Op een pull request wordt het image wel gebouwd maar niet gepusht, zodat een
      # kapotte Dockerfile alsnog opvalt voor de merge. github.repository_owner moet lowercase zijn voor
      # een registry-pad, vandaar de vaste "stensel8" i.p.v. de expressie.
      - name: Build and push the application image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: ${{ github.ref == 'refs/heads/main' }}
          # Zet een SBOM (lijst met alle packages) als attestation bij het image, op beide registries.
          sbom: true
          tags: |
            stensel8/devops-security:latest
            stensel8/devops-security:${{ github.sha }}
            ghcr.io/stensel8/devops-security:latest
            ghcr.io/stensel8/devops-security:${{ github.sha }}

  test:
    name: Test
    needs: [ build ]
    # Draait tegen het zojuist gepushte image, dus alleen op main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          # Docker login uit GitHub secrets. NOOIT hardcoded.
          # Secrets worden veilig geïnjecteerd en niet in logs getoond.
          username: ${{ secrets.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      # Test het image van deze commit (de SHA-tag), dus niet latest: dat kan intussen een andere zijn.
      # Geen trap meer die de container meteen opruimt: de Postman-tests hierna hebben 'm nog nodig.
      - name: Start the container for testing
        env:
          IMAGE: stensel8/devops-security:${{ github.sha }}
        run: |
          set -euo pipefail
          docker pull --quiet "$IMAGE" >/dev/null
          docker run -d --name test-container -p 80:5000 "$IMAGE"
          # De eerste verzoeken mislukken als de container nog opstart. Daarom wachten we stil tot de
          # app antwoordt, maximaal 30 seconden. Met --fail telt ook een HTTP 4xx of 5xx als mislukt.
          for _ in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://localhost; then
              echo "Container antwoordde met HTTP 2xx."
              exit 0
            fi
            sleep 1
          done
          echo "Container antwoordde niet binnen 30 seconden. Log van de container:" >&2
          docker logs test-container >&2
          exit 1

      # Postman-collectie (tests/postman/) met Newman: HTTP 200 + verwachte tekst, en dat de
      # security-headers uit week 3 er nog staan. GitHub-runners hebben Node.js al geïnstalleerd.
      - name: Run the Postman tests
        run: npx --yes newman run tests/postman/quoter-xp.postman_collection.json --env-var baseUrl=http://localhost

      - name: Stop the test container
        if: always()
        run: docker rm -f test-container >/dev/null 2>&1 || true

  # Scant het gepushte image met Docker Scout en faalt bij een Critical of High. Deploy wacht hierop, dus
  # zo'n image komt niet op het cluster. Draait alleen op main, want alleen daar wordt het image gepusht.
  # write-comment staat uit: opmerkingen plaatsen werkt alleen op pull requests. Het resultaat staat in de
  # samenvatting van de job.
  scan:
    name: Scan
    needs: [ build ]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          # Docker login uit GitHub secrets. NOOIT hardcoded!
          # Secrets worden veilig geïnjecteerd en niet in logs getoond.
          username: ${{ secrets.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PAT }}

      # Scant het image van deze commit (de SHA-tag), dus niet latest.
      - name: Analyze the image for vulnerabilities
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        with:
          command: cves
          image: stensel8/devops-security:${{ github.sha }}
          only-severities: critical,high
          exit-code: true
          write-comment: false

  deploy:
    name: Deploy
    needs: [ test, scan ]
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    timeout-minutes: 10
    # Twee deploys tegelijk zou elkaar in de weg zitten: ze wachten op elkaar.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pull-secret voor het cluster, gemaakt uit GitHub-secrets: het token staat dus niet
      # in een bestand of in de shell-history op CN1. Het is een apart alleen-lezen token.
      - name: Create image pull secret
        env:
          DOCKER_HUB_LOGIN: ${{ secrets.DOCKER_HUB_LOGIN }}
          DOCKER_HUB_PULL_PAT: ${{ secrets.DOCKER_HUB_PULL_PAT }}
        run: |
          : "${DOCKER_HUB_PULL_PAT:?secret DOCKER_HUB_PULL_PAT ontbreekt}"
          kubectl create secret docker-registry regcred \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="$DOCKER_HUB_LOGIN" \
            --docker-password="$DOCKER_HUB_PULL_PAT" \
            --dry-run=client -o yaml | kubectl apply -f -

      # In deployment.yaml staat :latest als plaatsvervanger. Hier vervangen we die door de tag van deze
      # commit. Elke deploy heeft dan een ander image en Kubernetes doet een echte rollout, waarbij de
      # oude pod blijft draaien tot de nieuwe gezond is. Daarna wachten we tot de uitrol echt klaar is en de
      # app antwoordt. Lukt dat niet, dan draaien we terug naar de vorige versie en faalt de job.
      - name: Deploy the new version
        env:
          IMAGE: stensel8/devops-security:${{ github.sha }}
        run: |
          set -euo pipefail

          rollback() {
            echo "Uitrol mislukt. Status van de pods:" >&2
            kubectl get pods -l app=quoterxp -o wide >&2 || true
            kubectl logs -l app=quoterxp --tail=20 --prefix >&2 || true
            echo "Terugdraaien naar de vorige versie." >&2
            kubectl rollout undo deployment/devops-security >&2 || true
            exit 1
          }

          sed "s|stensel8/devops-security:latest|${IMAGE}|" kubernetes/deployment.yaml | kubectl apply -f -
          kubectl apply -f kubernetes/service.yaml

          kubectl rollout status deployment/devops-security --timeout=120s || rollback

          for _ in $(seq 1 15); do
            if curl --fail --silent --output /dev/null http://localhost:30000; then
              echo "De nieuwe versie draait en antwoordt via de Service."
              exit 0
            fi
            sleep 2
          done
          rollback
