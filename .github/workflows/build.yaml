name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      push_to_dockerhub:
        description: 'Also push to Docker Hub'
        required: false
        default: 'false'

permissions:
  contents: read
  packages: write

jobs:

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"

      - name: Install Poetry
        run: pipx install poetry

      - name: Check pyproject.toml and poetry.lock are in sync
        working-directory: content
        run: poetry check --lock

      - name: Byte-compile the application
        run: python -m compileall content

  build:
    name: Build
    needs: [ validate ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub (optional)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.push_to_dockerhub == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          # Docker login uit GitHub secrets. NOOIT hardcoded!
          # Secrets worden veilig geïnjecteerd en niet in logs getoond.
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build and push to GHCR
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Build and push to Docker Hub (optional)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.push_to_dockerhub == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            hhmbroekman/student-app:latest

  test:
    name: Test
    needs: [ build ]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test the container
        run: |
          set -euo pipefail
          container=$(docker run -d -p 80:5000 ghcr.io/${{ github.repository }}:latest)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          curl --fail --silent --show-error \
               --retry 10 --retry-delay 2 --retry-all-errors \
               http://localhost >/dev/null
          echo "Container antwoordde met HTTP 2xx."

  deploy:
    name: Deploy
    needs: [ test ]
    if: github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
              sudo kubectl delete deployment --all
              sudo kubectl apply -f ${{ github.workspace }}/kubernetes/deployment.yaml --force
              sudo kubectl apply -f ${{ github.workspace }}/kubernetes/nginx-service.yaml --force
