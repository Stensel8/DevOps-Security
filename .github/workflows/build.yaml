name: CI/CD

# Pushes naar main draaien de volledige pipeline inclusief deploy.
# Pull requests valideren en bouwen alleen - geen image-push, geen deploy.
on:
  push:
    branches: [ main ]
  pull_request:

# Least privilege: geen enkele job schrijft naar de repo via GITHUB_TOKEN.
# Docker Hub authenticeert met eigen secrets.
permissions:
  contents: read

jobs:

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install Poetry
        run: pipx install poetry

      - name: Check pyproject.toml and poetry.lock are in sync
        working-directory: content
        run: poetry check --lock

      - name: Byte-compile the application
        run: python -m compileall content

  build:
    name: Build
    needs: [ validate ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          # Docker login uit GitHub secrets. NOOIT hardcoded!
          # Secrets worden veilig geïnjecteerd en niet in logs getoond.
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # Op een pull request wordt het image wel gebouwd maar niet gepusht,
      # zodat een kapotte Dockerfile alsnog opvalt voor de merge.
      - name: Build and push the Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            stensel8/devops-security:latest

  test:
    name: Test
    needs: [ build ]
    # Draait tegen het zojuist gepushte image, dus alleen na een push naar main.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          # Docker login uit GitHub secrets. NOOIT hardcoded!
          # Secrets worden veilig geïnjecteerd en niet in logs getoond.
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Smoke test the container
        run: |
          set -euo pipefail
          container=$(docker run -d -p 80:5000 stensel8/devops-security:latest)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          # --fail laat een HTTP 5xx de job rood maken; --retry vervangt een vaste sleep.
          curl --fail --silent --show-error \
               --retry 10 --retry-delay 2 --retry-all-errors \
               http://localhost >/dev/null
          echo "Container antwoordde met HTTP 2xx."

  deploy:
    name: Deploy
    needs: [ test ]
    if: github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
              sudo kubectl delete deployment --all
              sudo kubectl apply -f ${{ github.workspace }}/kubernetes/deployment.yaml --force
              sudo kubectl apply -f ${{ github.workspace }}/kubernetes/nginx-service.yaml --force
