# Dependabot version updates
# Dependabot houdt alle dependencies bij: de Python-packages (uv), de base images in het Dockerfile
# (inclusief het losse uv-image) en de GitHub Actions. Elke maandag komen er pull requests voor nieuwe
# versies, en elke PR draait door de CI/CD-pipeline.
#
# Wat Dependabot niet kan: versies in shellscripts bijwerken. De K3s-, Kubernetes- en Flannel-versie in
# kubernetes/install-k3s.sh en kubernetes/install-k8s.sh, en het losse uv-binary (met checksum) in
# build.yaml, werk ik daarom met de hand bij.
#
# Labels: Dependabot zet zelf "dependencies" en het label van het ecosystem (uv, docker,
# github_actions) op elke PR.
version: 2

updates:
  # ---------------------------------------------------------------
  # Python (uv) - pyproject.toml + uv.lock staan in /app
  # ---------------------------------------------------------------
  - package-ecosystem: "uv"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10
    # Ook de indirecte dependencies in uv.lock bijwerken (zoals MarkupSafe en click), niet alleen
    # de vier uit pyproject.toml. Zo blijft de hele lockfile actueel.
    allow:
      - dependency-type: "all"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Minor + patch samen in 1 PR; majors blijven losse PR's
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------
  # Docker base image - Dockerfile in root
  # De image staat vast op een digest (sha256). Dependabot werkt de tag en de digest bij.
  # ---------------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"

  # ---------------------------------------------------------------
  # GitHub Actions - .github/workflows (altijd directory "/")
  # De actions staan vast op een commit-SHA met de versie als commentaar. Dependabot werkt beide bij.
  # ---------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
